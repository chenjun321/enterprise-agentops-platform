[project]
name = "enterprise-agentops-platform"
version = "0.1.0"
description = "Enterprise multi-agent platform for sales, marketing, and customer QA workflows."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
rag = [
    "llama-index>=0.10.0",
    "llama-index-vector-stores-chroma>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"
